
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link
        rel="icon"
        type="image/png"
        href="assets/coruja.png"
    >
</head>

<body>

    <div class="login-container">

        <h2>Entrar</h2>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="loginSenha"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="esqueci-senha">
            <a href="esqueci-senha.html">
                Esqueci minha senha
            </a>
        </p>

        <p>
            Não tem conta?
            <a href="cadastro.html">
                Cadastre-se aqui
            </a>
        </p>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
