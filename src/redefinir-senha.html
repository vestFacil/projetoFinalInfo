
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova senha - VestFácil</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="assets/coruja.png">
</head>

<body>

    <div class="login-container">

        <h2>Criar nova senha</h2>

        <p>Digite sua nova senha para voltar a acessar o VestFácil.</p>

        <form id="redefinirSenhaForm">

            <input
                type="password"
                id="novaSenha"
                placeholder="Nova senha"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                id="confirmarSenha"
                placeholder="Confirme a nova senha"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Salvar nova senha
            </button>

        </form>

        <p id="mensagem"></p>

        <p>
            <a href="login.html">Voltar para o login</a>
        </p>

    </div>

    <script src="js/redefinir-senha.js"></script>

</body>
</html>
