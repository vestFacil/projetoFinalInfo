
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha - VestFácil</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="assets/coruja.png">
</head>
<body>
    <div class="login-container">
        <h2>Esqueceu sua senha?</h2>

        <p>Informe seu e-mail para receber um link de recuperação.</p>

        <form id="esqueciSenhaForm">
            <input
                type="email"
                id="emailRecuperacao"
                placeholder="Seu e-mail"
                required
            >

            <button type="submit">Enviar link</button>
        </form>

        <p id="mensagem" role="status"></p>

        <p>
            <a href="login.html">Voltar para o login</a>
        </p>
    </div>

    <script src="js/esqueci-senha.js"></script>
</body>
</html>
