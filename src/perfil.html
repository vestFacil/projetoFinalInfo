<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="css/perfil.css">
</head>

<body>

    <header class="topo">
        <a href="index.html" class="botao-inicio" title="Voltar ao início">🏠</a>
        <p>Meu Perfil</p>
    </header>

    <main class="perfil-container">

        <!-- Card do perfil -->
        <section class="perfil-card">
            <img src="img/user.png" alt="Foto do usuário" class="foto" id="fotoPerfil">
            <input type="file" id="fotoInput" accept="image/*" style="display:none">

            <h2 id="nomeUsuario">Nome usuário</h2>
            <p>Email: <span id="emailUsuario">@email.com</span></p>
            <p>Meta: <span id="bioUsuario">bio</span></p>

            <button id="btnEditar">Editar Perfil</button>
            <button id="btnSalvar" style="display:none">Salvar</button>
        </section>

        <!-- Estatísticas -->
        <section class="estatisticas">
            <div class="box">
                <h3>Questões Resolvidas</h3>
                <p id="questoesResolvidas">0</p>
            </div>

            <div class="box">
                <h3>Média Redação</h3>
                <p id="mediaRedacao">0</p>
            </div>

            <div class="box">
                <h3>Dias Estudando</h3>
                <p id="diasEstudando">0</p>
            </div>
        </section>

        <!-- Metas -->
        <section class="metas">
            <h2>Metas da Semana</h2>
            <input type="text" id="inputMeta" placeholder="Digite uma meta">
            <button id="btnAdicionarMeta">Adicionar Meta</button>
            <ul id="metasLista"></ul>
        </section>

    </main>

    <!-- Script externo que cuida de tudo -->
    <script src="js/perfil.js"></script>
</body>
</html>
