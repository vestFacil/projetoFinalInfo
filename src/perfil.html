<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <link rel="stylesheet" href="css/perfil.css">
</head>

<body>

    <header class="topo">

        <a href="index.html" class="botao-inicio" title="Voltar ao início">
            🏠
        </a>

        <p>Meu Perfil</p>

    </header>

    <main class="perfil-container">

        <section class="perfil-card">
            <img src="img/user.png" alt="Foto do usuário" class="foto" id="fotoPerfil">
            <input type="file" id="fotoInput" accept="image/*" style="display:none">

            <h2 id="nomeUsuario">Liz Gonçalves</h2>
            <p>Email: <span id="emailUsuario">liz@email.com</span></p>
            <p>Meta: <span id="bioUsuario">Medicina</span></p>

            <button id="btnEditar">Editar Perfil</button>
            <button id="btnSalvar" style="display:none">Salvar</button>
        </section>

        <section class="estatisticas">
            <div class="box">
                <h3>Questões Resolvidas</h3>
                <p id="questoesResolvidas">0</p>
            </div>

            <div class="box">
                <h3>Média Redação</h3>
                <p id="mediaRedacao">0</p>
            </div>

            <div class="box">
                <h3>Dias Estudando</h3>
                <p id="diasEstudando">0</p>
            </div>
        </section>

        <section class="metas">
            <h2>Metas da Semana</h2>
            <input type="text" id="inputMeta" placeholder="Digite uma meta">
            <button id="btnAdicionarMeta">Adicionar Meta</button>
            <ul id="metasLista"></ul>
        </section>

    </main>

    <script src="js/perfil.js"></script>

    <script>
window.onload = () => {
    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));
    if (!usuario) {
        alert("Você precisa fazer login primeiro!");
        window.location.href = "login.html";
        return;
    }

    // Buscar dados do perfil no servidor Node.js
    fetch("http://localhost:3000/perfil/" + usuario.id)
        .then(res => res.json())
        .then(data => {
            document.getElementById("nomeUsuario").textContent = data.nome;
            document.getElementById("emailUsuario").textContent = data.email;
            document.getElementById("fotoPerfil").src = data.foto || "img/user.png";

            // Estatísticas
            document.getElementById("questoesResolvidas").textContent = data.questoes_resolvidas;
            document.getElementById("mediaRedacao").textContent = data.media_redacao;
            document.getElementById("diasEstudando").textContent = data.dias_estudando;

            // Metas
            const metasLista = document.getElementById("metasLista");
            metasLista.innerHTML = "";
            data.metas.forEach(meta => {
                const li = document.createElement("li");
                li.textContent = meta.descricao + (meta.concluida ? " ✅" : "");
                metasLista.appendChild(li);
            });
        });
};
</script>

</body>
</html>
