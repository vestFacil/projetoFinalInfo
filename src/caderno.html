<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caderno</title>

    <link rel="stylesheet" href="css/caderno.css">
    <link rel="stylesheet" href="css/recompensas.css">
</head>


<body>


    <!-- =====================================================
         AÇÕES DO TOPO
         ===================================================== -->

    <div class="acoes-topo">


        <!-- RECOMPENSAS -->

        <button
            id="btnRecompensas"
            type="button"
            title="Minhas recompensas"
            aria-label="Minhas recompensas"
        >

            <img
                src="assets/estrela.png"
                class="iconeRecompensas"
                alt="Recompensas"
            >

        </button>


        <!-- BOTÃO INÍCIO -->

        <a
            href="index.html"
            class="botao-inicio"
            title="Voltar ao início"
            aria-label="Voltar ao início"
        >

            <img
                src="assets/casa.png"
                class="iconeInicio"
                alt="Início"
            >

        </a>


        <!-- PAINEL DE RECOMPENSAS -->

        <div
            id="painelRecompensas"
            style="display: none;"
        >


            <h2>

                <img
                    src="assets/estrela.png"
                    class="iconeRecompensas"
                    alt="Recompensas"
                >

                Minhas recompensas

            </h2>


            <button
                id="btnMensagem"
                type="button"
            >
                Ver mensagem motivacional
            </button>


            <button
                id="btnDica"
                type="button"
            >
                Ver dica de estudo
            </button>


            <p id="resultadoRecompensa"></p>


        </div>

    </div>


    <!-- =====================================================
         TOPO
         ===================================================== -->

    <header class="topo">

        <p>Caderno</p>

    </header>


    <!-- =====================================================
         CADERNO
         ===================================================== -->

    <main class="caderno">


        <!-- =================================================
             NOVA ANOTAÇÃO
             ================================================= -->

        <section class="nova-anotacao">

            <h2>Nova anotação</h2>


            <label for="materia">
                Matéria
            </label>


            <select id="materia">

                <option value="">
                    Selecione uma matéria
                </option>

                <option value="portugues">
                    Português
                </option>

                <option value="literatura">
                    Literatura
                </option>

                <option value="artes">
                    Artes
                </option>

                <option value="historia">
                    História
                </option>

                <option value="geografia">
                    Geografia
                </option>

                <option value="filosofia">
                    Filosofia
                </option>

                <option value="sociologia">
                    Sociologia
                </option>

                <option value="biologia">
                    Biologia
                </option>

                <option value="quimica">
                    Química
                </option>

                <option value="fisica">
                    Física
                </option>

                <option value="matematica">
                    Matemática
                </option>

                <option value="ingles">
                    Inglês
                </option>

                <option value="espanhol">
                    Espanhol
                </option>

            </select>


            <label for="titulo">
                Título
            </label>


            <input
                type="text"
                id="titulo"
                placeholder="Ex.: Leis de Newton"
            >


            <label for="anotacao">
                Anotação
            </label>


            <textarea
                id="anotacao"
                placeholder="Escreva sua anotação aqui..."
            ></textarea>


            <button
                id="salvar"
                type="button"
            >
                Salvar anotação
            </button>

        </section>


        <!-- =================================================
             MINHAS ANOTAÇÕES
             ================================================= -->

        <section class="minhas-anotacoes">


            <!-- CORUJINHA -->

            <img
                src="assets/coruja.png"
                class="coruja-caderno"
                alt="Coruja"
            >


            <h2>
                Minhas anotações
            </h2>


            <!-- FILTROS -->

            <div class="filtros">


                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar anotação..."
                >


                <select id="filtro-materia">

                    <option value="">
                        Todas as matérias
                    </option>

                    <option value="portugues">
                        Português
                    </option>

                    <option value="literatura">
                        Literatura
                    </option>

                    <option value="artes">
                        Artes
                    </option>

                    <option value="historia">
                        História
                    </option>

                    <option value="geografia">
                        Geografia
                    </option>

                    <option value="filosofia">
                        Filosofia
                    </option>

                    <option value="sociologia">
                        Sociologia
                    </option>

                    <option value="biologia">
                        Biologia
                    </option>

                    <option value="quimica">
                        Química
                    </option>

                    <option value="fisica">
                        Física
                    </option>

                    <option value="matematica">
                        Matemática
                    </option>

                    <option value="ingles">
                        Inglês
                    </option>

                    <option value="espanhol">
                        Espanhol
                    </option>

                </select>

            </div>


            <!-- LISTA -->

            <div id="lista-anotacoes">

                <!-- As anotações aparecerão aqui pelo JavaScript -->

            </div>

        </section>

    </main>


    <!-- =====================================================
         SCRIPTS
         ===================================================== -->

    <script src="js/caderno.js"></script>

    <script src="js/recompensa.js"></script>


</body>

</html>
