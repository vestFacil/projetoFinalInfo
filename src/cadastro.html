<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Cadastro - Vestfacil</title>

  <link rel="stylesheet" href="css/cadastro.css">

  <!-- Ícone da aba -->
  <link
    rel="icon"
    type="image/png"
    href="assets/coruja.png"
  >
</head>

<body>

  <div class="cadastro-container">

    <h2>Cadastrar</h2>

    <form id="cadastroForm" onsubmit="cadastrar(event)">

      <input
        type="text"
        id="nome"
        placeholder="Nome"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
        required
      >

      <input
        type="password"
        id="senha"
        placeholder="Senha"
        required
      >

      <input
        type="text"
        id="bio"
        placeholder="Curso de interesse"
        required
      >

      <!-- Caixa de seleção dos Termos de Uso -->
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 0.9rem; text-align: left;">
        <input type="checkbox" id="termos" required style="cursor: pointer;">
        <label for="termos" style="cursor: pointer; color: #555;">
          Li e concordo com os <a href="termos.html" target="_blank" rel="noopener noreferrer" style="color: #4A90E2; text-decoration: underline;">Termos de Uso</a>.
        </label>
      </div>

      <button type="submit">
        Cadastrar
      </button>

    </form>

    <p>
      Já tem conta?
      <a href="login.html">Faça login</a>
    </p>

  </div>

  <script src="js/cadastro.js"></script>

</body>

</html>
