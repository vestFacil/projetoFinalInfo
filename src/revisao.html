
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Área de Revisão</title>

    <!-- ESTILOS -->
    <link
        rel="stylesheet"
        href="css/revisao.css"
    >

    <link
        rel="stylesheet"
        href="css/recompensas.css"
    >

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="assets/coruja.png"
    >
</head>

<body>

    <!-- =====================================================
         BOTÃO INÍCIO
         ===================================================== -->

    <a
        href="index.html"
        class="botao-inicio"
        title="Voltar ao início"
        aria-label="Voltar ao início"
    >
        <img
            src="assets/casa.png"
            class="iconeInicio"
            alt="Início"
        >
    </a>

    <!-- =====================================================
         ÁREA DE REVISÃO
         ===================================================== -->

    <main>

        <h1>
            📚 Área de Revisão
        </h1>

        <p>
            Aqui você poderá revisar questões que já respondeu.
        </p>

        <div id="listaRevisao">
            Carregando questões...
        </div>

    </main>

    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer class="rodape">

        <p>© 2026 VestFácil</p>

        <p>
            Desenvolvido por Letícia Ferreira Rangel e
            Liz Gonçalves de Almeida
        </p>

    </footer>

    <!-- =====================================================
         VERIFICAÇÃO DE LOGIN E CARREGAMENTO DO SCRIPT
         ===================================================== -->

    <script>
        (() => {
            let usuarioLogado = null;

            try {
                usuarioLogado = JSON.parse(
                    localStorage.getItem("usuarioLogado")
                );
            } catch (erro) {
                usuarioLogado = null;
            }

            // Impede o acesso sem um usuário identificado.
            if (!usuarioLogado || !usuarioLogado.id) {
                window.location.replace("login.html");
                return;
            }

            // Mantém o funcionamento da área de revisão.
            const scriptRevisao = document.createElement("script");
            scriptRevisao.src = "js/revisao.js";
            document.body.appendChild(scriptRevisao);
        })();
    </script>

</body>

</html>
